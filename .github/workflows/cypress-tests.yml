name: Cypress E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ParaBank end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: electron
          command: npm run test:ci

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-evidence
          path: |
            reports/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14
